services:
  db:
    image: postgres:16-alpine
    container_name: edcmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edcmanager
    ports:
      - "5432:5432"
    volumes:
      - edcmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edcmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edcmanager-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      AUTH_SECRET: ${AUTH_SECRET:-edc-docker-secret-change-me}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/edcmanager?schema=public
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-EDC Manager <noreply@edc.local>}
      AI_INSIGHTS_ENABLED: ${AI_INSIGHTS_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy

volumes:
  edcmanager_pgdata:
